name: 프로덕션 스모크

# 배포 후 회귀를 사람이 매번 수동 실행하던 것을 자동화 (로드맵 P0-2).
# - 매일 1회(KST 09:30) 정기 점검
# - 수동 실행(workflow_dispatch)으로 배포 직후에도 즉시 확인
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   E2E_USER_EMAIL     테스트 계정 이메일 (일반 유저 권한이면 충분)
#   E2E_USER_PASSWORD  테스트 계정 비밀번호
# 선택:
#   E2E_BASE_URL       기본값 https://k-haehwadang.com
#
# ⚠️ 어드민 스펙(admin*.spec.ts)은 마스터 권한이 필요해 이 워크플로에서 제외한다.
#    프로덕션 계정을 상시 admin 으로 두지 않기 위함.

on:
  schedule:
    - cron: '30 0 * * *' # UTC 00:30 = KST 09:30
  workflow_dispatch:
    inputs:
      base_url:
        description: '대상 URL (비우면 프로덕션)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # ⚠️ --workers=1 필수: 스펙 전부가 **같은 테스트 계정 하나**를 조작한다.
      #    병렬로 돌리면 서로의 상태(테마 적용·충전·가이드 진행률)를 밟아 플레이크가 난다(실측).
      #    --retries=1 은 네트워크 흔들림 대비.
      - name: 프로덕션 스모크 실행
        env:
          E2E_PROD_SMOKE: '1'
          E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://k-haehwadang.com' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          npx playwright test \
            e2e/prod/console-probe.spec.ts \
            e2e/prod/shrine-nav.spec.ts \
            e2e/prod/family-shrine.spec.ts \
            e2e/prod/store.spec.ts \
            e2e/prod/notifications.spec.ts \
            e2e/prod/shrine-effects.spec.ts \
            --project=chromium --reporter=line --workers=1 --retries=1

      - name: 실패 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
